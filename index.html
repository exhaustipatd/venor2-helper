<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1211" />
    <meta
      name="description"
      content="Venor2 cserekereső, egész csomagos mennyiségtervező és kisállat-gyűjtemény. Saját piaci árak, helyi mentések, fiók nélkül."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%media/venor-mark.svg" />
    <script>
      try {
        const saved = localStorage.getItem('venor-helper:theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>Venor Helper</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
